name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TrokLogix.slnx

      - name: Build
        run: dotnet build TrokLogix.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish TrokLogix.Web/TrokLogix.Web.csproj --configuration Release --no-build --output publish

      # The published site, downloadable from the run's page. Deployment to InterServer comes later.
      - uses: actions/upload-artifact@v4
        with:
          name: troklogix-web
          path: publish
